<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex</title>

    <link rel="icon" href="./assets/favicon.ico">

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/responsive.css">

    <script src="./scripts/api.js" defer></script>
    <script src="./scripts/templates.js" defer></script>
    <script src="./scripts/search.js" defer></script>
    <script src="./scripts/script.js" defer></script>
</head>

<body onload="init()">
    <header>
        <h1>Pokedex</h1>

        <div class="search-container">
            <input data-id="search-input" type="text" placeholder="Search Pokemon" onkeydown="searchOnEnter(event)">
            <button data-id="search-button" onclick="searchPokemon()">Search</button>
        </div>
    </header>

    <main data-id="content">
        <p data-id="not-found"></p>
        <ul data-id="pokemon-list"></ul>
        <button data-id="load-more-button" onclick="loadMore()">Load more</button>
    </main>

    <dialog data-id="dialog" onclick="closeDialogOnOutsideClick(event)"></dialog>
</body>

</html>
